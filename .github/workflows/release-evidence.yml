# Release Evidence（独立于 PR CI，手动触发）：
# PR CI 只回答"能不能合并"；本 workflow 回答"这个 exact SHA 有什么发布证据"。
# 唯一权威入口 scripts/write-contract-evidence.py：删旧 json → 全量 build →
# 固定 14 suites 全过才写 contract.json。performance.json / soak.json /
# real-device.json 以后按需追加到此文件，不进 PR critical path。
name: release-evidence
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master@2026-09-05
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: contract evidence (14 suites, exact SHA)
        run: python scripts/write-contract-evidence.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-evidence
          path: target/validation/contract.json
          if-no-files-found: error
