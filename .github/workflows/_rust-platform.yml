# Rust Platform（Linux ARM / Win x64 / Win ARM）：跨平台编译保证 + smoke。
#
# CI v3 瘦身：
# - smoke（PR）：cargo check 全 workspace（类型/条件编译正确）+
#   必要 binary link（contract smoke 真正需要的 bins）+
#   platform-sensitive suites（nextest ci-platform，soak 除外）。
#   不再全 workspace bins + 全 targets --no-run。
# - full（main）：一次 all-targets 构建覆盖全 workspace 检查、bins 与测试程序，
#   ci-platform 复用产物执行全量（soak 除外；soak 归 stress）。
# 平台无关逻辑不重复全量——由 Linux canonical 覆盖。
name: rust-platform
on:
  workflow_call:
    inputs:
      runs-on:
        required: true
        type: string
      cache-domain:
        description: "兼容域（ci.yml matrix 显式传入；fail-closed）"
        required: true
        type: string
      mode:
        description: "smoke（PR）或 full（main）"
        required: false
        default: "smoke"
        type: string
      build-targets:
        description: "planner build_targets JSON（smoke 叠加受影响驱动 bins）"
        required: false
        default: '{"kind":"bins"}'
        type: string
      soak:
        description: "run 或 skip（长 soak 归属 stress）"
        required: false
        default: "skip"
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  platform:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Rust setup
        uses: ./.github/actions/rust-ci-setup
        with:
          cache-domain: ${{ inputs.cache-domain }}
          cache-writer: "true"
          install-nextest: "true"

      # smoke 不构建全部测试，仍单独做全目标检查；FULL 由下面的 all-targets 构建覆盖。
      - name: check workspace
        if: inputs.mode == 'smoke'
        run: >
          cargo check
          --locked
          --workspace
          --all-targets
          --all-features
          --exclude mesa-performance-tests

      # 必要 binary link（CI v3.1 B+，test-driver 退役后更新）：discovery 用
      # MesaManager::discover 扫描 drivers/*/driver.toml 并 resolve executable——
      # opcua/sinumerik 缺 binary 即 DRIVER_UNAVAILABLE 真红；s7 缺 binary 则
      # 存在 503 假绿出口（已由 discovery_contract 前置 find_driver + body 断言双拦）。
      # mesa-test-driver 是 test-only runtime prerequisite（contract smoke 拉起
      # 真实 test-driver 子进程必需；cargo 只构建其 lib，不产出 executable）——
      # 不恢复其产品身份（不在 drivers/、不被生产 discover、不进 UI）。
      # 固定 runtime prerequisites + 当前 planner 受影响驱动（selective 意图保留，
      # 不退回全 workspace bins；FOCAS-link 覆盖仍在）。
      - name: build required binaries
        if: inputs.mode == 'smoke'
        shell: bash
        env:
          BUILD_TARGETS: ${{ inputs.build-targets }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess
          fixed = ['mesad', 'mesa-test-driver',
                   'mesa-driver-s7',
                   'mesa-driver-opcua', 'mesa-driver-sinumerik-nck',
                   'mesa-contract-tests']
          try:
              spec = json.loads(os.environ.get('BUILD_TARGETS') or '{}')
          except Exception:
              spec = {}
          extra = []
          if isinstance(spec, dict) and spec.get('kind') == 'packages':
              for p in spec.get('packages', []):
                  if isinstance(p, str) and p and p.startswith('mesa-driver-') and p not in fixed:
                      extra.append(p)
          pkgs = fixed + sorted(set(extra) - set(fixed))
          cmd = ['cargo', 'build', '--locked', '--all-features'] + [x for p in pkgs for x in ('-p', p)] + ['--bins']
          print('prereq:', ' '.join(cmd))
          subprocess.run(cmd, check=True)
          EOF

      # PR smoke：只执行 platform-sensitive suites（soak 除外）。
      - name: nextest platform smoke
        if: inputs.mode == 'smoke'
        run: >
          cargo nextest run
          --locked
          -p mesa-contract-tests
          --all-features
          --profile ci-platform
          -E 'package(=mesa-contract-tests) and (binary(=smoke) or binary(=protocol_negotiation) or binary(=fault_tolerance) or binary(=discovery_contract) or binary(=session_lifecycle) or binary(=stop_lifecycle) or binary(=subprocess_orphan_guard) or binary(=subprocess_recovery) or binary(=mesad_restart)) and (not (binary(=event_soak) or binary(=event_pressure)))'

      # FULL 一次编译所有旧 check 目标及 runtime bins，nextest 复用测试程序。
      # examples/benches 也实际构建，不能通过删 check 遗漏原有检查范围。
      - name: build all targets (full only)
        if: inputs.mode != 'smoke'
        run: cargo build --locked --workspace --all-targets --all-features --exclude mesa-performance-tests --timings

      - name: nextest platform full (soak excluded)
        if: inputs.mode != 'smoke'
        run: >
          cargo nextest run
          --locked
          --workspace
          --all-features
          --exclude mesa-performance-tests
          --profile ci-platform
          -E 'not (package(=mesa-contract-tests) and (binary(=event_soak) or binary(=event_pressure)))'

      # soak 独占 step：默认 skip；run 时才执行（main full / nightly）。
      - name: nextest soak (stress-owned)
        if: inputs.soak == 'run'
        run: >
          cargo nextest run
          --locked
          -p mesa-contract-tests
          --all-features
          --profile ci-platform
          -E 'package(=mesa-contract-tests) and (binary(=event_soak) or binary(=event_pressure))'

      - name: upload event soak diagnostics
        if: always() && inputs.soak == 'run'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: event-soak-platform-${{ inputs.cache-domain }}-${{ github.run_attempt }}
          path: target/validation/event-soak/
          if-no-files-found: warn

      # 诊断附件放在测试之后；上传故障不能阻止测试或改变测试准入结果。
      - name: upload build timings
        if: always() && inputs.mode != 'smoke'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-timings-${{ inputs.cache-domain }}
          path: target/cargo-timings/
          if-no-files-found: warn

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
