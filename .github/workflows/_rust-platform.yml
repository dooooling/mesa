# Rust Platform（Linux ARM / Win x64 / Win ARM）：跨平台编译保证 + smoke。
#
# CI v3 瘦身：
# - smoke（PR）：cargo check 全 workspace（类型/条件编译正确）+
#   必要 binary link（contract smoke 真正需要的 bins）+
#   platform-sensitive suites（nextest ci-platform，soak 除外）。
#   不再全 workspace bins + 全 targets --no-run。
# - full（main）：check 全 workspace + bins 全 link + ci-platform 全量
#   （soak 除外；soak 归 stress）。
# 平台无关逻辑不重复全量——由 Linux canonical 覆盖。
name: rust-platform
on:
  workflow_call:
    inputs:
      runs-on:
        required: true
        type: string
      cache-domain:
        description: "兼容域（ci.yml matrix 显式传入；fail-closed）"
        required: true
        type: string
      mode:
        description: "smoke（PR）或 full（main）"
        required: false
        default: "smoke"
        type: string
      soak:
        description: "run 或 skip（长 soak 归属 stress）"
        required: false
        default: "skip"
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  platform:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Rust setup
        uses: ./.github/actions/rust-ci-setup
        with:
          cache-domain: ${{ inputs.cache-domain }}
          cache-writer: "true"
          install-nextest: "true"

      # 全 workspace 类型/条件编译正确（check，不 link 全量；
      # performance-tests 与旧行为一致，继续 exclude）。
      - name: check workspace
        run: >
          cargo check
          --locked
          --workspace
          --all-targets
          --all-features
          --exclude mesa-performance-tests

      # 必要 binary link：contract smoke 需要 mesad + simulator；
      # helper bins 随 contract-tests 测试构建自动产出（cargo 按需）。
      - name: build required binaries
        run: cargo build --locked -p mesad -p mesa-driver-simulator --bins

      # PR smoke：只执行 platform-sensitive suites（soak 除外）。
      - name: nextest platform smoke
        if: inputs.mode == 'smoke'
        run: >
          cargo nextest run
          --locked
          -p mesa-contract-tests
          --all-features
          --profile ci-platform
          -E 'package(=mesa-contract-tests) and (binary(=smoke) or binary(=protocol_negotiation) or binary(=fault_tolerance) or binary(=discovery_contract) or binary(=session_lifecycle) or binary(=stop_lifecycle) or binary(=subprocess_orphan_guard) or binary(=subprocess_recovery) or binary(=mesad_restart)) and (not (binary(=event_soak) or binary(=event_pressure)))'

      # main full：bins 全 link + ci-platform 全量（soak 除外；soak 归 stress）。
      - name: build all bins (full only)
        if: inputs.mode != 'smoke'
        run: cargo build --locked --workspace --bins

      - name: nextest platform full (soak excluded)
        if: inputs.mode != 'smoke'
        run: >
          cargo nextest run
          --locked
          --workspace
          --all-features
          --exclude mesa-performance-tests
          --profile ci-platform
          -E 'not (package(=mesa-contract-tests) and (binary(=event_soak) or binary(=event_pressure)))'

      # soak 独占 step：默认 skip；run 时才执行（main full / nightly）。
      - name: nextest soak (stress-owned)
        if: inputs.soak == 'run'
        run: >
          cargo nextest run
          --locked
          -p mesa-contract-tests
          --all-features
          --profile ci-platform
          -E 'package(=mesa-contract-tests) and (binary(=event_soak) or binary(=event_pressure))'

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
