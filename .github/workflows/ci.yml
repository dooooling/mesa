# CI 统一入口/调度：本文件是唯一监听 PR/push 的 workflow，
# 实际工作下沉到 _rust-primary/_rust-native/_web（均为 workflow_call，
# 不各自监听 pull_request）。Branch Protection 只绑定最后的 `ci-gate`，
# 内部增删 job 不需要再改保护规则。
#
# 成本模型（相对旧单 matrix 四平台全量）：
#   fmt ×1 / clippy ×1 / web ×1 / fast-perf ×1 / correctness ×4
#   + stress ×1（稳定化阶段：win-x64 关键场景重复采样，见 _runtime-stress.yml）
# 四平台正确性（build/test/IPC/子进程/孤儿）一点没少。
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限意图：本 CI 只读 checkout + 运行测试/构建，不写回仓库。
permissions:
  contents: read

# 同一 PR 新 push 自动取消旧 run（省 runner）；push main 不 cancel。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CI-1 fast-path 路由：纯非代码改动（docs/.gitignore/md-only）跳过 heavy jobs。
  # fail-safe：只有白名单内文件才 fast；任何未知路径/代码/workflow/lock
  # 即 full CI。workflow 永远启动、ci-gate 永远出现（Branch Protection 只绑 gate）。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.route.outputs.heavy }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # PR 取 base..head 全量变更；main push 取前后 commit。
          fetch-depth: 0
      - id: route
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'EOF'
          import os, subprocess, sys
          base, head = os.environ['BASE'], os.environ['HEAD']
          try:
              out = subprocess.run(
                  ['git', 'diff', '--name-only', f'{base}...{head}'],
                  capture_output=True, text=True, check=True).stdout.splitlines()
          except subprocess.CalledProcessError as e:
              print(f'diff failed, fallback full CI: {e}', file=sys.stderr)
              print('heavy=true')
              open(os.environ['GITHUB_OUTPUT'], 'a').write('heavy=true\n')
              sys.exit(0)
          # fail-safe 白名单：只有这些才 fast（其余一律 heavy）。
          def fast(p):
              pl = p.lower()
              if p == '.gitignore':
                  return True
              if p == 'docs/' or p.startswith('docs/'):
                  return True
              if pl.endswith('.md'):
                  return True
              return False
          heavy = 'false' if (out and all(fast(p) for p in out)) else 'true'
          print(f'files={len(out)} heavy={heavy}')
          for p in out[:20]:
              print(f'  {p}')
          open(os.environ['GITHUB_OUTPUT'], 'a').write(f'heavy={heavy}\n')
          EOF

  rust-primary:
    needs: [changes]
    if: needs.changes.outputs.heavy == 'true'
    uses: ./.github/workflows/_rust-primary.yml

  rust-native:
    needs: [changes]
    if: needs.changes.outputs.heavy == 'true'
    strategy:
      # 工业跨平台：一次 run 给出完整平台分布，不为省几分钟开 fail-fast
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04-arm
          - runs-on: windows-latest
          - runs-on: windows-11-arm
    uses: ./.github/workflows/_rust-native.yml
    with:
      runs-on: ${{ matrix.runs-on }}

  web:
    needs: [changes]
    if: needs.changes.outputs.heavy == 'true'
    uses: ./.github/workflows/_web.yml

  # Runtime Stress（稳定化阶段 merge-required）：见 _runtime-stress.yml。
  # 只跑 Windows x64 关键场景重复采样，与 native job 并行。
  runtime-stress:
    needs: [changes]
    if: needs.changes.outputs.heavy == 'true'
    uses: ./.github/workflows/_runtime-stress.yml
    with:
      runs-on: windows-latest

  # 唯一 Merge Gate：依赖全部 success 才 success。
  # CI-1：fast path 下 heavy jobs 为 skipped；skipped 视为满足（fail-safe 白名单
  # 之外一律 heavy；skipped≠failure，显式允许）。
  ci-gate:
    needs: [changes, rust-primary, rust-native, web, runtime-stress]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: all required jobs must succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 -c "import json,os,sys; n=json.loads(os.environ['NEEDS_JSON']); bad={k:v.get('result') for k,v in n.items() if k!='changes' and v.get('result') not in ('success','skipped')}; print(json.dumps(n,indent=1)); print('GATE FAILED: %s' % bad if bad else 'GATE OK'); sys.exit(1 if bad else 0)"
