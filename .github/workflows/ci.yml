# CI：单编译、锁版、多平台（Windows/Linux × x86/ARM 原生 test）
# - 锁版：rust 1.95.0（本地 rustc 1.95.0，见 rust-toolchain.toml）、node 22.18.0、pnpm 10.28.0，actions pin 防漂移
# - 单编译：fmt→clippy→test 复用同一 target（同 job 内顺序执行，无多编译），本次弃用跨 run 缓存以避 proto build 产物 stale（Mesa.driver.v1.rs）
# - 多平台：Windows/Linux × x86_64/aarch64 四组合均原生 test
# - 严格：fmt --check、clippy -D warnings、test --workspace --all-features、web build
name: CI
on:
  push:
    branches: [main, master, feat/v2.1-impl]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: windows-latest
          - os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.28.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18.0'
          cache: 'pnpm'
          cache-dependency-path: 'apps/mesa-web/pnpm-lock.yaml'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: install protoc (ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: set PROTOC env (ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: echo "PROTOC=/usr/bin/protoc" >> $GITHUB_ENV

      - name: debug protoc (ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          echo "PROTOC=$PROTOC"
          protoc --version
          ls -l proto/driver.proto
          echo "CARGO_MANIFEST_DIR test"
          ls -l crates/driver-protocol/build.rs

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: build drivers
        run: cargo build --locked --workspace

      - name: test
        run: cargo test --locked --workspace --all-features

      - name: pnpm install
        run: pnpm --dir apps/mesa-web install

      - name: web build
        run: pnpm --filter mesa-web build

      - name: release validation
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/generate-release-validation.py --validate
