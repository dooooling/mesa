# CI 统一入口/调度（CI v2）：本文件是唯一监听 PR/push 的 workflow，
# 实际工作下沉到 _rust-quality/_rust-canonical/_rust-platform/_rust-stress/
# _rust-perf/_web（均为 workflow_call，不各自监听 pull_request）。
# Branch Protection 只绑定最后的 `ci-gate`，内部增删 job 不需要再改保护规则。
#
# 模型（CI v2）：
#   planner（tools/ci/plan.py，唯一调度真值）
#   ├─ docs-only → gate
#   ├─ web
#   ├─ rust-quality（fmt/clippy/planner 自测，与 canonical 并行）
#   ├─ rust-canonical（Linux x64 语义正确性主平台，nextest + doctest）
#   ├─ rust-platform ×3（全 workspace 编译 + smoke；main 上 full）
#   ├─ rust-stress（风险触发；main Rust change 必跑）
#   └─ rust-perf（风险触发；与 canonical 并行）
# PR 快速反馈 + main 全集成安全网（不再机械完全重复）。
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限意图：本 CI 只读 checkout + 运行测试/构建，不写回仓库。
permissions:
  contents: read

# 同一 PR 新 push 自动取消旧 run（省 runner）；push main 不 cancel。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CI v2 planner：变更路径 → 执行计划（tools/ci/plan.py）。
  # fail-safe：未知路径/空 diff/diff 失败 → FULL；main Rust change → 全集成。
  # workflow 永远启动、ci-gate 永远出现（Branch Protection 只绑 gate）。
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.route.outputs.plan }}
      quality: ${{ steps.route.outputs.quality }}
      canonical: ${{ steps.route.outputs.canonical }}
      canonical_filter: ${{ steps.route.outputs.canonical_filter }}
      canonical_soak: ${{ steps.route.outputs.canonical_soak }}
      canonical_contract_bins: ${{ steps.route.outputs.canonical_contract_bins }}
      platform_mode: ${{ steps.route.outputs.platform_mode }}
      platform_soak: ${{ steps.route.outputs.platform_soak }}
      build_targets: ${{ steps.route.outputs.build_targets }}
      stress: ${{ steps.route.outputs.stress }}
      perf: ${{ steps.route.outputs.perf }}
      web: ${{ steps.route.outputs.web }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # PR 取 base..head 全量变更；main push 取前后 commit。
          fetch-depth: 0
      - id: route
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          CI_BASE="$BASE" CI_HEAD="$HEAD" CI_IS_MAIN="$([ "$IS_MAIN" = "true" ] && echo 1 || echo 0)" python3 tools/ci/plan.py > plan.json
          cat plan.json
          {
            echo "plan=$(cat plan.json | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)))')"
            echo "quality=$(python3 -c 'import json; print(str(json.load(open("plan.json"))["quality"]).lower())')"
            echo "canonical=$(python3 -c 'import json; print(str(json.load(open("plan.json"))["canonical"]).lower())')"
            echo "canonical_filter=$(python3 -c 'import json; print(json.load(open("plan.json"))["canonical_filter"])')"
            echo "canonical_soak=$(python3 -c 'import json; print(json.load(open("plan.json"))["canonical_soak"])')"
            echo "canonical_contract_bins=$(python3 -c 'import json; print(str(json.load(open("plan.json"))["canonical_contract_bins"]).lower())')"
            echo "platform_mode=$(python3 -c 'import json; print(json.load(open("plan.json"))["platform_mode"])')"
            echo "platform_soak=$(python3 -c 'import json; print(json.load(open("plan.json"))["platform_soak"])')"
            echo "build_targets=$(python3 -c 'import json; print(json.dumps(json.load(open("plan.json"))["build_targets"]))')"
            echo "stress=$(python3 -c 'import json; print(str(json.load(open("plan.json"))["stress"]).lower())')"
            echo "perf=$(python3 -c 'import json; print(str(json.load(open("plan.json"))["perf"]).lower())')"
            echo "web=$(python3 -c 'import json; print(str(json.load(open("plan.json"))["web"]).lower())')"
          } >> "$GITHUB_OUTPUT"

  rust-quality:
    needs: [plan]
    if: needs.plan.outputs.quality == 'true'
    uses: ./.github/workflows/_rust-quality.yml

  rust-canonical:
    needs: [plan]
    if: needs.plan.outputs.canonical == 'true'
    uses: ./.github/workflows/_rust-canonical.yml
    with:
      filter: ${{ needs.plan.outputs.canonical_filter }}
      build-targets: ${{ needs.plan.outputs.build_targets }}
      contract-bins: ${{ needs.plan.outputs.canonical_contract_bins }}
      soak: ${{ needs.plan.outputs.canonical_soak }}

  rust-platform:
    needs: [plan]
    if: needs.plan.outputs.platform_mode != 'skip'
    strategy:
      # 工业跨平台：一次 run 给出完整平台分布，不为省几分钟开 fail-fast
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04-arm
            cache-domain: linux-arm64
          - runs-on: windows-latest
            cache-domain: windows-x64
          - runs-on: windows-11-arm
            cache-domain: windows-arm64
    uses: ./.github/workflows/_rust-platform.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      cache-domain: ${{ matrix.cache-domain }}
      mode: ${{ needs.plan.outputs.platform_mode }}
      soak: ${{ needs.plan.outputs.platform_soak }}

  web:
    needs: [plan]
    if: needs.plan.outputs.web == 'true'
    uses: ./.github/workflows/_web.yml

  # Stress：PR 按 planner 风险触发；main Rust change 必跑（plan 已升级）。
  rust-stress:
    needs: [plan]
    if: needs.plan.outputs.stress == 'true'
    uses: ./.github/workflows/_rust-stress.yml
    with:
      runs-on: windows-latest

  # Perf：PR 按 planner 风险触发；与 canonical 并行。
  rust-perf:
    needs: [plan]
    if: needs.plan.outputs.perf == 'true'
    uses: ./.github/workflows/_rust-perf.yml

  # 唯一 Merge Gate：plan 驱动 fail-closed（plan_version/bool/mode 全校验）。
  ci-gate:
    needs: [plan, rust-quality, rust-canonical, rust-platform, web, rust-stress, rust-perf]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: plan-driven gate (fail-closed)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          n = json.loads(os.environ['NEEDS_JSON'])
          print(json.dumps(n, indent=1))
          fail = []
          pl = n.get('plan', {})
          if pl.get('result') != 'success':
              fail.append(f"plan 必须 success（实际 {pl.get('result')}）")
              print('GATE FAILED: %s' % fail)
              sys.exit(1)
          out = pl.get('outputs') or {}
          try:
              plan = json.loads(out.get('plan', '{}'))
          except Exception as e:
              fail.append(f'plan 输出不可解析（{e}）→ FAIL CLOSED')
              print('GATE FAILED: %s' % fail)
              sys.exit(1)
          if plan.get('plan_version') != 3:
              fail.append(f"plan_version 必须 3（实际 {plan.get('plan_version')}）")
          def need(job, want_run, want_skip=False):
              r = n.get(job, {}).get('result')
              if want_run and r != 'success':
                  fail.append(f'{job} 必须 success（实际 {r}）')
              if want_skip and r != 'skipped':
                  fail.append(f'{job} 应 skipped（实际 {r}）')
          def asbool(v):
              if isinstance(v, bool):
                  return v
              return str(v).lower() == 'true'
          # quality / canonical / web / stress / perf：bool 驱动。
          for key, job in [('quality', 'rust-quality'), ('canonical', 'rust-canonical'),
                           ('web', 'web'), ('stress', 'rust-stress'), ('perf', 'rust-perf')]:
              v = plan.get(key)
              if not isinstance(v, bool):
                  fail.append(f'{key} 必须 bool（实际 {v!r}）→ FAIL CLOSED')
                  continue
              need(job, v, not v)
          # platform：mode 驱动。
          mode = plan.get('platform_mode')
          if mode == 'skip':
              need('rust-platform', False, True)
          elif mode in ('smoke', 'full'):
              need('rust-platform', True)
          else:
              fail.append(f'platform_mode 未知（{mode!r}）→ FAIL CLOSED')
          # CI v3 新 schema：soak/build_targets/contract_bins 全校验（BLOCKER 真修）。
          # soak 非 run/skip 即 fail；contract_bins 非 bool 即 fail。
          for key in ('canonical_soak', 'platform_soak'):
              v = plan.get(key)
              if v not in ('run', 'skip'):
                  fail.append(f'{key} 必须 run/skip（实际 {v!r}）→ FAIL CLOSED')
          v = plan.get('canonical_contract_bins')
          if not isinstance(v, bool):
              fail.append(f'canonical_contract_bins 必须 bool（实际 {v!r}）→ FAIL CLOSED')
          bt = plan.get('build_targets')
          if not isinstance(bt, dict):
              fail.append(f'build_targets 必须 object（实际 {bt!r}）→ FAIL CLOSED')
          else:
              kind = bt.get('kind')
              if kind not in ('none', 'bins', 'packages'):
                  fail.append(f'build_targets.kind 非法（{kind!r}）→ FAIL CLOSED')
              elif kind == 'packages':
                  pkgs = bt.get('packages')
                  if (not isinstance(pkgs, list) or not pkgs
                          or any(not isinstance(p, str) or not p for p in pkgs)
                          or len(set(pkgs)) != len(pkgs)):
                      fail.append(f'build_targets.packages 必须非空唯一 string[]（实际 {pkgs!r}）→ FAIL CLOSED')
          # 关系约束：false/skip 侧的附属字段必须无意义值。
          if plan.get('canonical') is False and plan.get('canonical_soak') != 'skip':
              fail.append('canonical=false 时 canonical_soak 必须 skip → FAIL CLOSED')
          if plan.get('canonical') is False and plan.get('canonical_contract_bins') is not False:
              fail.append('canonical=false 时 canonical_contract_bins 必须 false → FAIL CLOSED')
          if plan.get('platform_mode') == 'skip' and plan.get('platform_soak') != 'skip':
              fail.append('platform skip 时 platform_soak 必须 skip → FAIL CLOSED')
          if plan.get('canonical') is True and isinstance(bt, dict) and bt.get('kind') == 'none':
              fail.append('canonical=true 时 build_targets 不能 none → FAIL CLOSED')
          print('GATE FAILED: %s' % fail if fail else 'GATE OK')
          sys.exit(1 if fail else 0)
          EOF
