# CI 统一入口/调度：本文件是唯一监听 PR/push 的 workflow，
# 实际工作下沉到 _rust-primary/_rust-native/_web（均为 workflow_call，
# 不各自监听 pull_request）。Branch Protection 只绑定最后的 `ci-gate`，
# 内部增删 job 不需要再改保护规则。
#
# 成本模型（相对旧单 matrix 四平台全量）：
#   fmt ×1 / clippy ×1 / web ×1 / fast-perf ×1 / correctness ×4
# 四平台正确性（build/test/IPC/子进程/孤儿）一点没少。
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限意图：本 CI 只读 checkout + 运行测试/构建，不写回仓库。
permissions:
  contents: read

# 同一 PR 新 push 自动取消旧 run（省 runner）；push main 不 cancel。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-primary:
    uses: ./.github/workflows/_rust-primary.yml

  rust-native:
    strategy:
      # 工业跨平台：一次 run 给出完整平台分布，不为省几分钟开 fail-fast
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04-arm
          - runs-on: windows-latest
          - runs-on: windows-11-arm
    uses: ./.github/workflows/_rust-native.yml
    with:
      runs-on: ${{ matrix.runs-on }}

  web:
    uses: ./.github/workflows/_web.yml

  # 唯一 Merge Gate：依赖全部 success 才 success。
  ci-gate:
    needs: [rust-primary, rust-native, web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: all required jobs must succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 -c "import json,os,sys; n=json.loads(os.environ['NEEDS_JSON']); bad={k:v.get('result') for k,v in n.items() if v.get('result')!='success'}; print(json.dumps(n,indent=1)); print('GATE FAILED: %s' % bad if bad else 'GATE OK'); sys.exit(1 if bad else 0)"
