# Web（Ubuntu x64，一次）：mesa-web 与 Rust Native 并行跑，
# Windows/ARM runner 不再为 Rust 装 Node/pnpm。
name: web
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.28.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.18.0'
          cache: 'pnpm'
          cache-dependency-path: 'apps/mesa-web/pnpm-lock.yaml'

      - name: pnpm install
        # PR8 起含 Web 单测新依赖；沙箱外首次安装后应重锁 lockfile 并恢复 --frozen-lockfile
        # TODO(web): 有网络环境执行 pnpm --dir apps/mesa-web install 后提交 lockfile，恢复 frozen 安装
        run: pnpm --dir apps/mesa-web install --no-frozen-lockfile

      - name: web test
        run: pnpm --filter mesa-web test

      - name: web build
        run: pnpm --filter mesa-web build
