# Rust Stress（Windows x64）：event 60s soak / stop / pressure / management
# 关键场景重复采样，按 planner 的 runtime-sensitive 路由触发。
# 完整集合先执行一次；PR 只对并发门追加采样，Nightly/主分支保留完整二次采样。
name: rust-stress
on:
  workflow_call:
    inputs:
      runs-on:
        required: true
        type: string
      repeat-all:
        description: "是否重复完整套件；false 时仅重复已列出的并发门"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  stress:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Rust setup
        uses: ./.github/actions/rust-ci-setup
        with:
          cache-domain: windows-x64
          cache-writer: "false"
          install-nextest: "true"

      # test-driver 等子进程类测试需要真实 executable（cargo build 默认
      # 只构建 lib，不产出 [[bin]]；--bins 保证 mesa-test-driver 可 launch）。
      - name: build runtime binaries
        run: >
          cargo build --locked --all-features --bins
          -p mesad -p mesa-contract-tests -p mesa-test-driver
          -p mesa-driver-s7 -p mesa-driver-focas2 -p mesa-driver-opcua -p mesa-driver-sinumerik-nck

      # 最易抖场景 ×2：60s 稳态 soak（Stop/drain 全链路 + 溢出边界）。
      - name: stress event_soak 60s x2
        run: >
          cargo nextest run --locked -p mesa-contract-tests --all-features
          --profile ci-stress --test event_soak sim_steady_state_soak_60s_no_loss_no_drift
          && cargo nextest run --locked -p mesa-contract-tests --all-features
          --profile ci-stress --test event_soak sim_steady_state_soak_60s_no_loss_no_drift

      # 完整集合必须执行；含 in-flight 判别 hold，不缩短时间预算。
      - name: stress stop_lifecycle
        run: >
          cargo nextest run --locked -p mesa-contract-tests --all-features
          --profile ci-stress --test stop_lifecycle

      # 容量公式 Gates ×1（速率 SLO + stall 恢复 + 溢出边界，内含长 hold）。
      - name: stress event_pressure x1
        run: >
          cargo nextest run --locked -p mesa-contract-tests --all-features
          --profile ci-stress --test event_pressure

      - name: stress management_api
        run: >
          cargo nextest run --locked -p mesa-contract-tests --all-features
          --profile ci-stress --test management_api

      # 重复采样不是失败重试：前面任一失败会直接使 job 失败，不会由此变绿。
      - name: repeat concurrency gates (full on nightly)
        shell: bash
        env:
          REPEAT_ALL: ${{ inputs.repeat-all }}
        run: |
          python3 - <<'EOF'
          import os, subprocess
          stop = [
              'double_start_only_one_attempt_at_table_level',
              'start_rejected_while_stop_intent_persist_in_flight',
              'late_stop_a_write_cannot_override_new_start',
              'slow_start_persist_does_not_delay_stop_begin',
              'await_settled_requires_confirmed_stop_intent_under_slow_db',
              'concurrent_delete_and_delete_during_teardown_are_safe',
              'delete_racing_start_never_leaves_orphan_attempt',
              'delete_waits_for_inflight_stop_persist_and_rebuild_is_not_polluted',
              'cancelled_delete_request_does_not_leave_a_permanent_barrier',
          ]
          management = [
              'probe_concurrent_same_driver_all_succeed',
              'definition_query_concurrency_budget_rejects_immediately',
              'definition_query_permits_release_on_all_paths_and_cancel_reaps_process',
          ]
          def selected(binary, tests):
              base = f'binary(={binary})'
              if os.environ['REPEAT_ALL'] == 'true':
                  return base
              return base + ' & (' + ' | '.join(f'test(={t})' for t in tests) + ')'
          filt = selected('stop_lifecycle', stop) + ' | ' + selected('management_api', management)
          subprocess.run(['cargo', 'nextest', 'run', '--locked', '-p', 'mesa-contract-tests',
                          '--all-features', '--profile', 'ci-stress', '-E', filt], check=True)
          EOF

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
