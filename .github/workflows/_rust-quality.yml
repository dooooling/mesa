# Rust Quality（Linux x64，唯一）：fmt / clippy / planner 自测 / offline 工具自测。
# 与 canonical 并行启动，不堵测试。
# protoc：全部走 protoc-bin-vendored（Cargo.lock 锁定），不 apt install，
# 不设 PROTOC（build.rs 无 PROTOC 时自动用 vendored，更确定性）。
name: rust-quality
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Rust setup
        uses: ./.github/actions/rust-ci-setup
        with:
          components: "rustfmt,clippy"
          cache-domain: linux-x64
          cache-writer: "false"
          install-nextest: "false"

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: CI planner self-test
        run: python3 tools/ci/test_plan.py

      - name: FOCAS offline diff self-test
        run: python3 tools/ci/test_focas_diff.py

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
