# Rust Native 正确性（Linux ARM / Win x64 / Win ARM）：只做平台相关验证——
# workspace build + workspace test（除 performance）。fmt/clippy/web 不重复。
# performance 固定只在 Primary 跑一次：跨 runner 的性能数字无横向比较价值。
name: rust-native
on:
  workflow_call:
    inputs:
      runs-on:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  native:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master@2026-09-05
        with:
          toolchain: '1.95.0'

      # CI-2 canonical Rust build cache（key 按 runs-on 隔离；
      # main 保存、PR 只恢复；默认不含 workspace crate）。
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: native-${{ inputs.runs-on }}
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: build workspace
        run: cargo build --locked --workspace

      - name: test workspace (excluding performance)
        run: cargo test --locked --workspace --all-features --exclude mesa-performance-tests
