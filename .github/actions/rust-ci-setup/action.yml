# 共享 Rust CI 环境（CI v2 cache topology v2）：所有 Rust job 唯一 setup 入口。
#
# 拓扑（local sccache + archive save；GHA remote backend 已废弃）：
# - sccache 只写本地盘（SCCACHE_DIR=$RUNNER_TEMP/mesa-sccache，512M）；
#   job 结束时由 actions/cache 一次性归档——不再对 cache service 发几百次 PUT。
# - Cargo registry cache：shared-key 按兼容域（add-job-id-key=false），
#   只缓存 registry/git（cache-targets/bin=false）。
# - 兼容域（4 个）：linux-x64 / windows-x64 / windows-arm64 / linux-arm64；
#   同域 job 共用 archive。每域仅 1 writer（main 才 save），其余 restore-only。
#
# 输入：
#   components: 额外 toolchain 组件（默认空；quality 传 rustfmt,clippy）
#   cache-domain: 兼容域（linux-x64/windows-x64/windows-arm64/linux-arm64；
#                 同时决定 sccache archive 与 registry key）
#   cache-writer: 是否为该域 writer（main 成功时 save；reader 永不 save）
#   install-nextest: 是否安装 nextest（test job true；quality false）
name: rust-ci-setup
description: "Mesa CI v2 共享 Rust 环境：toolchain + registry cache + local sccache archive + nextest（可选）"
inputs:
  components:
    description: "额外 rust-toolchain 组件（逗号分隔）"
    required: false
    default: ""
  cache-domain:
    description: "兼容域（linux-x64/windows-x64/windows-arm64/linux-arm64）"
    required: true
  cache-writer:
    description: "是否为该域 writer（main save；reader 永不 save）"
    required: false
    default: "false"
  install-nextest:
    description: "是否安装 cargo-nextest 0.9.146"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # toolchain 唯一真值：解析 rust-toolchain.toml channel（升级只改一处）。
    - name: Resolve toolchain channel
      id: toolchain
      shell: bash
      run: |
        CH=$(python3 -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml','rb'))['toolchain']['channel'])")
        echo "channel=$CH" >> "$GITHUB_OUTPUT"
        echo "toolchain channel: $CH"

    - name: Rust toolchain
      uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master@2026-09-05
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        components: ${{ inputs.components }}

    # Cargo registry cache（shared-key 按兼容域；不缓存 target/bin；
    # save 仅 main + writer——与 sccache archive 同策略）。
    - name: Rust cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: cargo-${{ inputs.cache-domain }}
        add-job-id-key: "false"
        cache-bin: "false"
        cache-targets: "false"
        save-if: ${{ github.ref == 'refs/heads/main' && inputs.cache-writer == 'true' }}

    # sccache 安装（只装二进制；不再用 GHA remote backend）。
    - name: sccache
      uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: "v0.18.0"

    - name: Install nextest
      if: inputs.install-nextest == 'true'
      uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29
      with:
        tool: cargo-nextest@0.9.146

    # 本地 sccache 环境（local disk；512M；writer/reader 同环境，
    # 区别只在 archive save 侧；cache-domain allowlist 校验 fail-closed）。
    - name: sccache env (local disk archive)
      shell: bash
      run: |
        case "${{ inputs.cache-domain }}" in
          linux-x64|windows-x64|windows-arm64|linux-arm64) ;;
          *) echo "cache-domain 非法：${{ inputs.cache-domain }}（linux-x64/windows-x64/windows-arm64/linux-arm64）" >&2; exit 1 ;;
        esac
        echo "SCCACHE_DIR=$RUNNER_TEMP/mesa-sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_CACHE_SIZE=512M" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        echo "sccache domain: ${{ inputs.cache-domain }}"
        echo "sccache writer: ${{ inputs.cache-writer }}"
        echo "sccache remote backend: disabled (local archive topology v2)"
        sccache --version
        sccache --show-config || true

    # sccache archive restore（全 job；primary key 含 SHA generation 后缀——
    # Actions Cache entry immutable，exact 优先命中同 SHA 世代，
    # fallback 同域 env-hash / 同域任意；content 兼容由 sccache 自管）。
    - name: Restore sccache archive
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/mesa-sccache
        key: mesa-sccache-v2-${{ inputs.cache-domain }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
        restore-keys: |
          mesa-sccache-v2-${{ inputs.cache-domain }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}-
          mesa-sccache-v2-${{ inputs.cache-domain }}-

    # sccache archive save（仅 main + writer；key 含 SHA generation——
    # 每次 main 产生新世代 archive；reader 永不 save）。
    - name: Save sccache archive
      if: github.ref == 'refs/heads/main' && inputs.cache-writer == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/mesa-sccache
        key: mesa-sccache-v2-${{ inputs.cache-domain }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
