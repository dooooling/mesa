[workspace]
resolver = "2"
members = [
    "crates/core-types",
    "crates/driver-protocol",
    "crates/driver-sdk",
    "crates/driver-manager",
    "crates/config-store",
    "crates/core-api",
    "apps/forgelinkd",
    "drivers/simulator",
    "drivers/s7",
    "drivers/focas2",
    "drivers/opcua",
    "tests/driver-contract",
    "tests/performance",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.dependencies]
forgelink-core-types = { path = "crates/core-types" }
forgelink-driver-protocol = { path = "crates/driver-protocol" }
forgelink-driver-sdk = { path = "crates/driver-sdk" }
forgelink-driver-manager = { path = "crates/driver-manager" }
forgelink-config-store = { path = "crates/config-store" }
forgelink-core-api = { path = "crates/core-api" }

rusqlite = { version = "0.32", features = ["bundled"] }

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
prost = "0.13"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
toml = "0.8"
getrandom = "0.2"

[profile.release]
# M0 保持默认优化即可，性能调优留到 Phase 8
