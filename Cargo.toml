[workspace]
resolver = "2"
members = [
    "crates/core-types",
    "crates/driver-protocol",
    "crates/driver-sdk",
    "crates/driver-manager",
    "crates/config-store",
    "crates/event-store",
    "crates/core-api",
    "apps/mesad",
    "tests/support/test-driver",
    "drivers/s7",
    "drivers/focas2",
    "drivers/opcua",
    "drivers/sinumerik-nck",
    "crates/opcua-transport",
    "crates/s7-transport",
    "tools/nck-emulator",
    "tests/driver-contract",
    "tests/performance",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "UNLICENSED"

[workspace.dependencies]
mesa-core-types = { path = "crates/core-types" }
mesa-driver-protocol = { path = "crates/driver-protocol" }
mesa-driver-sdk = { path = "crates/driver-sdk" }
mesa-driver-manager = { path = "crates/driver-manager" }
mesa-config-store = { path = "crates/config-store" }
mesa-event-store = { path = "crates/event-store" }
mesa-core-api = { path = "crates/core-api" }
mesa-opcua-transport = { path = "crates/opcua-transport" }
mesa-s7-transport = { path = "crates/s7-transport" }

rusqlite = { version = "0.32", features = ["bundled"] }

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
prost = "0.13"
bytes = "1"
libc = "0.2"
windows-sys = { version = "0.59", features = ["Win32_System_Performance", "Win32_System_Threading", "Win32_Foundation", "Win32_System_JobObjects"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# Unicode 规范等价（NFC）：`point_key` 的字符串载荷必须先做 NFC，否则同一逻辑文本的
# NFC/NFD 两种写法会得到两个 Key，点位身份不再稳定（反例 E3）。
#
# 版本与 feature 都是**契约的一部分**，不得随手放宽：
# - `=0.1.25`：精确锁定。`point_key` 的身份编码依赖该 crate 内嵌的 Unicode 数据表
#   （0.1.25 = Unicode 17.0.0）。次要版本升级即可能更换数据版本，从而改动边缘字符串的
#   规范编码 ⇒ 同一逻辑点位的 Key 漂移。升级必须显式改本行 + 复核 golden 向量 + 更新
#   `tests/fixtures/nck-point-key-golden.json` 的 `unicode_version` 字段。
# - `default-features = false`：该 crate 唯一的 feature `std` 只切换 `no_std`/`std`
#   （对 NFC 语义与结果无影响，见其 `#![cfg_attr(not(feature = "std"), no_std)]`），
#   本仓库只使用 `nfc()` 迭代器，故不启用，保持最小依赖面。
#
# 归一形式**只允许 NFC**：绝不以 NFKC/NFKD 替代——兼容归一会把 `ﬁ`(U+FB01) → `fi`、
# 全角 `Ａ`(U+FF21) → `A` 等语义不同的文本折叠成同一 Key，制造身份碰撞。
unicode-normalization = { version = "=0.1.25", default-features = false }
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
async-stream = "0.3"
tokio-stream = "0.1"
toml = "0.8"
getrandom = "0.2"
chacha20poly1305 = "0.10"
base64 = "0.22"

[profile.release]
# NOTE: 当前保持默认优化；TODO: Phase 8 按 §22 50K/s 压测调优
