[workspace]
resolver = "2"
members = [
    "crates/core-types",
    "crates/driver-protocol",
    "crates/driver-sdk",
    "crates/driver-manager",
    "crates/config-store",
    "crates/core-api",
    "apps/mesad",
    "drivers/simulator",
    "drivers/s7",
    "drivers/focas2",
    "drivers/opcua",
    "tests/driver-contract",
    "tests/performance",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.dependencies]
mesa-core-types = { path = "crates/core-types" }
mesa-driver-protocol = { path = "crates/driver-protocol" }
mesa-driver-sdk = { path = "crates/driver-sdk" }
mesa-driver-manager = { path = "crates/driver-manager" }
mesa-config-store = { path = "crates/config-store" }
mesa-core-api = { path = "crates/core-api" }

rusqlite = { version = "0.32", features = ["bundled"] }

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
prost = "0.13"
bytes = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
toml = "0.8"
getrandom = "0.2"

[profile.release]
# NOTE: 当前保持默认优化；TODO: Phase 8 按 §22 50K/s 压测调优
