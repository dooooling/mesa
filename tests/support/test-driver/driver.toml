# mesa-test-driver — Contract/Performance Test 专用测试驱动（非正式设备协议）。
#
# 前身为 `drivers/simulator`（mesa-driver-simulator / SimulatorDriver /
# driver_id = "simulator"）。退役产品身份后迁移至此：不再出现在正式
# `drivers/` discovery 目录；`driver_id` 固定为 "test-driver"。
