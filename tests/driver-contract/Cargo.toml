[package]
name = "mesa-contract-tests"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
mesa-core-types = { workspace = true }
mesa-driver-protocol = { workspace = true }
mesa-driver-sdk = { workspace = true }
mesa-driver-simulator = { path = "../../drivers/simulator" }
mesa-driver-s7 = { path = "../../drivers/s7" }
mesa-driver-focas2 = { path = "../../drivers/focas2" }
mesa-driver-opcua = { path = "../../drivers/opcua" }
mesa-driver-sinumerik = { path = "../../drivers/sinumerik" }
mesa-core-api = { path = "../../crates/core-api" }
mesa-driver-manager = { workspace = true }
mesa-event-store = { workspace = true }
axum = { workspace = true }
tower = "0.5"
mesa-config-store = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
windows-sys = { workspace = true }
libc = { workspace = true }
# PR9 fixture：Mesa-owned OPC UA Event 服务器（与 driver 侧同版本）
async-opcua-server = "0.19"
async-opcua-nodes = "0.19"
async-opcua-types = "0.19"

# NOTE: Contract 基线（§21 全部 20 项 + V2.1 扩展）共 14 suites，见 tests/；
# Simulator 已第一个全过，S7/FOCAS2/OPC UA 不得绕过或裁剪该基线。

# PR10 fault-injection：busy 锁测试需直连 SQLite（仅测试用）。
# test-hooks：mesa-event-store 的 StoreFaults 故障注入编译开关；
# 放 dev-dependencies 使 `cargo build`（生产图）永不启用，
# 仅 `cargo test` 激活。
[dev-dependencies]
rusqlite = { workspace = true }
mesa-event-store = { workspace = true, features = ["test-hooks"] }
