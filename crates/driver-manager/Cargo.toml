[package]
name = "mesa-driver-manager"
version.workspace = true
edition.workspace = true
license.workspace = true

rust-version.workspace = true

[features]
# 测试故障注入与调度控制（teardown panic、reaper 挂起、Endpoint 退避时钟）。
# 生产图不启用；仅合同测试经 dev-dependencies 打开，与其他存储包的 test-hooks 同口径。
test-hooks = []

[dependencies]
mesa-core-types = { workspace = true }
mesa-driver-protocol = { workspace = true }
mesa-config-store = { workspace = true }
mesa-event-store = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
getrandom = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# 仅进程内计时单测暂停 Tokio 时钟；真实子进程与生产计时不受影响。
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
